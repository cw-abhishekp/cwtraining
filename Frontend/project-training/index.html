<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-hidden="true">
    <strong>✔ Message Sent!</strong>
    <p>Thanks for completing the form. We'll be in touch soon!</p>
  </div>

  <main class="container">
    <form id="contactForm" novalidate>
      <h1>Contact Us</h1>

      <div class="row">
        <div class="field">
          <label for="firstName">First Name <span>*</span></label>
          <input id="firstName" name="firstName" type="text" required />
          <small class="error" aria-live="polite"></small>
        </div>

        <div class="field">
          <label for="lastName">Last Name <span>*</span></label>
          <input id="lastName" name="lastName" type="text" required />
          <small class="error" aria-live="polite"></small>
        </div>
      </div>

      <div class="field">
        <label for="email">Email Address <span>*</span></label>
        <input id="email" name="email" type="email" required />
        <small class="error" aria-live="polite"></small>
      </div>

      <fieldset class="field">
        <legend>Query Type <span>*</span></legend>

        <label class="radio">
          <input type="radio" name="query" value="general" />
          General Enquiry
        </label>

        <label class="radio">
          <input type="radio" name="query" value="support" />
          Support Request
        </label>

        <small class="error" aria-live="polite"></small>
      </fieldset>

      <div class="field">
        <label for="message">Message <span>*</span></label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <small class="error" aria-live="polite"></small>
      </div>

      <div class="field checkbox">
        <label>
          <input type="checkbox" id="consent" required />
          I consent to being contacted by the team <span>*</span>
        </label>
        <small class="error" aria-live="polite"></small>
      </div>

      <button type="submit">Submit</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>

</html>
