<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <div class="toast-message">
      <span class="toast-title">✔ Message Sent!</span>
      <p>Thanks for completing the form. We'll be in touch soon!</p>
    </div>
  </div>

  <main class="container">
    <form id="contactForm" novalidate>
      <h1>Contact Us</h1>

      <!-- First + Last name -->
      <div class="row">
        <div class="field">
          <label id="labelId">First Name <span class="required">*</span></label>
          <input type="text" id="firstName" />
          <small class="error"></small>
        </div>

        <div class="field">
          <label id="labelId">Last Name <span class="required">*</span></label>
          <input type="text" id="lastName" />
          <small class="error"></small>
        </div>
      </div>

      <!-- Email -->
      <div class="field">
        <label id="labelId">Email Address <span class="required"> *</span></label>
        <input type="email" id="email" />
        <small class="error"></small>
      </div>

      <!-- Query Type -->
      <div class="field">
        <label id="labelId">Query Type <span class="required"> *</span></label>

        <div class="row">
          <label class="radio" id="labelId">
            <input type="radio" name="query" value="general" />
            General Enquiry
          </label>

          <label class="radio" id="labelId">
            <input type="radio" name="query" value="support" />
            Support Request
          </label>
        </div>

        <small class="error"></small>
      </div>

      <!-- Message -->
      <div class="field">
        <label id="labelId">Message <span class="required"> *</span></label>
        <textarea id="message"></textarea>
        <small class="error"></small>
      </div>

      <!-- Consent -->
      <div class="field checkbox">
        <label id="labelId">
          <input type="checkbox" id="consent" />
          I consent to being contacted by the team <span class="required"> *</span>
        </label>
        <small class="error"></small>
      </div>

      <button type="submit">Submit</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>

</html>
