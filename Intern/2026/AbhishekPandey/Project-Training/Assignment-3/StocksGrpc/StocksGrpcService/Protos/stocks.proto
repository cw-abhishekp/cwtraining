syntax = "proto3";

import "google/protobuf/empty.proto";

option csharp_namespace = "StocksGrpcService.Protos";

package stocks;

// gRPC Service Definition
service StockService {
  rpc GetFilteredStocks (FiltergrpcDTO) returns (StocksListResponsegrpcDTO);
}

// Filter Request Message
message FiltergrpcDTO {
  repeated int32 fuel_type_ids = 1;      // List<int>? FuelTypeIds
  optional double min_budget = 2;         // double? MinBudget
  optional double max_budget = 3;         // double? MaxBudget
  repeated int32 make_ids = 4;           // List<int>? MakeIds
  repeated int32 city_ids = 5;           // List<int>? CityIds
  int32 sort_by_type = 6;                // SortByType enum (as int)
  int32 page = 7;                        // int Page
}

// Single Stock Message
message StocksResponsegrpcDTO {
  optional string profile_id = 1;        // "1"
  optional int32 make_id = 2;            // 10
  optional string make_name = 3;         // "Maruti Suzuki"
  optional int32 city_id = 4;            // 176
  optional string city_name = 5;         // "Chennai"
  optional string version_name = 6;      // "VXi [2014-2019]"
  optional int32 km_numeric = 7;         // 12563
  optional string fuel = 8;              // "Petrol"
  optional int32 make_year = 9;          // 2016
  optional int32 price_numeric = 10;     // "263000"
  optional int32 emi_price = 11;         // "EMI Starts at ₹4,731"
  repeated string stock_images = 12;     // Array of image URLs
  optional string model_name = 13;        // "Swift"
}

message StocksListResponsegrpcDTO {
  repeated StocksResponsegrpcDTO stocks = 1;  // List of stocks
  int64 total_count = 2;                      // Total count
}
